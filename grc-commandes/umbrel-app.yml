category: finance
name: GR Commandes
version: "0.1.1"
tagline: Commandes, devis, factures et reçus de GR Créations
icon: https://raw.githubusercontent.com/asand04/grc-umbrel-apps/main/grc-commandes/icon.svg
description: >-
  Suivi des commandes d'impression 3D de GR Créations : clients, lignes et totaux en FCFA, acompte et solde,
  statuts (Nouveau → Devis envoyé → Acompte payé → En production → Livré), devis / factures / reçus en PDF
  aux couleurs de la marque, photos par commande, catalogue avec prix par défaut, tableau de bord et
  sauvegardes nocturnes. Interface en français, pensée pour le téléphone.
releaseNotes: >-
  0.1.1 : plus d'erreur « Control server » au démarrage (socket de contrôle gunicorn désactivé).
  Première version fonctionnelle : commandes, devis, factures, reçus, photos, tableau de bord, sauvegardes.
