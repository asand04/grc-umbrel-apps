version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grc-commandes_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/asand04/grc-commandes:0.1.2@sha256:5279e7e2e8ff4f7b60c149747d92dc63b7842b91ce0e2a3be959470cae72cc92
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRC_DATA_DIR: /data
      TZ: Africa/Porto-Novo
    volumes:
      - ${APP_DATA_DIR}/data:/data
