version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grc-commandes_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/asand04/grc-commandes:0.1.0@sha256:54373840602413f1037035294a42498ab7ad9986f35e8f677c097b1b290e47e4
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRC_DATA_DIR: /data
      TZ: Africa/Porto-Novo
    volumes:
      - ${APP_DATA_DIR}/data:/data
