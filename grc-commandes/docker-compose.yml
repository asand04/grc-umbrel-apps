version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grc-commandes_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/asand04/grc-commandes:0.1.1@sha256:137be8dc5bd9f81a543dbcf8bc669cad5dd75ff8b2712b9c12338056b69c07c3
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRC_DATA_DIR: /data
      TZ: Africa/Porto-Novo
    volumes:
      - ${APP_DATA_DIR}/data:/data
