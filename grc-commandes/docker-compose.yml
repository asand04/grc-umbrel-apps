version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grc-commandes_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/asand04/grc-commandes:0.1.3@sha256:254b9b9b0ddf5dbf4f08ffd05d6755c6eaaa2219eebd177759d95c027d41e09c
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      GRC_DATA_DIR: /data
      TZ: Africa/Porto-Novo
    volumes:
      - ${APP_DATA_DIR}/data:/data
